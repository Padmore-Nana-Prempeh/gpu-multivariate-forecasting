seed: 42
data:
  path: data/ETTm1.csv
  seq_len: 96
  horizon: 24
  train_ratio: 0.7
  val_ratio: 0.1
  batch_size: 256
  num_workers: 0
  pin_memory: false
model:
  name: transformer
  hidden_size: 92
  num_layers: 2
  dropout: 0.1
  nhead: 4
  tcn_channels:
  - 64
  - 88
  - 88
  - 88
  - 88
train:
  epochs: 20
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  prefetch_stream: false
  compile: false
  device: cuda
  non_blocking_h2d: false
output:
  dir: results/cuda_amp
